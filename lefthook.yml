pre-commit:
  parallel: true
  jobs:
    - name: backend-fmt
      root: "backend/"
      glob: "*.rs"
      run: cargo fmt --manifest-path Cargo.toml -- --check

    - name: backend-clippy
      root: "backend/"
      glob: "*.rs"
      run: cargo clippy --manifest-path Cargo.toml --all-targets -- -D warnings

    - name: frontend-build
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: npm run build

pre-push:
  parallel: false
  jobs:
    - name: backend-test
      root: "backend/"
      glob: "*.rs"
      run: cargo test --manifest-path Cargo.toml
