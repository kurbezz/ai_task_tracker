[package]
name = "ai-task-tracker"
version = "0.1.0"
edition = "2021"

[lib]
name = "ai_task_tracker"
path = "src/lib.rs"

[[bin]]
name = "ai-task-tracker"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
rust-embed = "8"
mime_guess = "2"
http = "1"
rmcp = { version = "=0.10.0", features = ["server", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
schemars = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
